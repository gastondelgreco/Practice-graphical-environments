<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina de bienvenida</title>
    <link rel="stylesheet" href="estilosParcial.css">
</head>
<body>
    <h1>!Bienvenido a mi pagina!</h1>
    <p>Esta es una pagina de ejemplo para el parcial con un mensaje de bienvenida.</p>
    <a href="https://frro.cvg.utn.edu.ar/">Enlace de ejemplo a alguna pagina web random</a>
    <form action="procesarForm.php" method="post">
        <div class="nombre">
            <label for="name">Nombre:</label>
            <input type="text" id="name" name="name" required><br>
        </div>
        <div class="correoE">
            <label for="email">Email:</label>
            <input type="text" id="email" name="email" required><br>
        </div>
        <div class="nombreProducto">
            <label for="productName">Nombre del producto:</label>
            <input type="text" id="productName" name="productName" required><br>
        </div>
        <div class="mes">
            <label for="month">Mes</label>
            <select id="month" name="month">
                <option value="Enero">Enero</option>
                <option value="Febrero">Febrero</option>
                <option value="Marzo">Marzo</option>
                <option value="Abril">Abril</option>
                <option value="Mayo">Mayo</option>
                <option value="Junio">Junio</option>
                <option value="Julio">Julio</option>
                <option value="Agosto">Agosto</option>
                <option value="Septiembre">Septiembre</option>
                <option value="Octubre">Octubre</option>
                <option value="Noviembre">Noviembre</option>
                <option value="Diciembre">Diciembre</option>
            </select><br>
        </div>
        <div class="cantidad">
            <label for="quantity">Cantidad:</label>
            <input type="number" id="quantity" name="quantity" required><br>
        </div>
        <div class="terminos">
            <label for="terms">Acepto terminos y condiciones:</label>
            <input type="checkbox" id="terms" name="checkbox" required><br>
        </div>
        <div class="boton">
            <button type="submit">Enviar</button>
        </div>
    </form>
</body>
</html>
